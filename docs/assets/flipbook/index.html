<!doctype html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Legacy In Ink: The Final Frequency</title>
  <style>
    :root {
      --paper: #efe5cf;
      --ink: #121210;
      --red: #a41814;
      --muted: #6b5d4e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--paper);
      background:
        radial-gradient(circle at 20% 10%, rgba(164, 24, 20, .22), transparent 28%),
        linear-gradient(135deg, #080807, #1a1411 48%, #090908);
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .18;
      background-image:
        linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 18px 18px;
      mix-blend-mode: overlay;
    }
    .shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 24px clamp(14px, 3vw, 38px) 38px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }
    .brand {
      display: grid;
      gap: 4px;
    }
    .eyebrow {
      color: #ffefdf;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .16em;
    }
    h1 {
      margin: 0;
      max-width: 620px;
      color: white;
      font-size: clamp(28px, 5vw, 58px);
      line-height: .95;
      text-transform: uppercase;
    }
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    button, a.download {
      border: 2px solid var(--paper);
      background: var(--paper);
      color: var(--ink);
      min-height: 44px;
      padding: 0 16px;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 5px 5px 0 rgba(164, 24, 20, .85);
    }
    button:hover, a.download:hover { transform: translate(-1px, -1px); }
    .reader {
      position: relative;
      display: grid;
      place-items: center;
      min-height: calc(100vh - 190px);
      perspective: 1400px;
    }
    .book {
      position: relative;
      width: min(76vh, 88vw);
      aspect-ratio: 2 / 3;
      filter: drop-shadow(0 32px 42px rgba(0, 0, 0, .46));
    }
    .page {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,.2);
      background: var(--paper);
      transform-origin: left center;
      transition: transform .5s ease, opacity .35s ease;
      opacity: 0;
      pointer-events: none;
    }
    .page.active {
      opacity: 1;
      transform: rotateY(0deg);
      z-index: 4;
    }
    .page.prev {
      opacity: .22;
      transform: rotateY(-22deg) translateX(-6%);
      z-index: 1;
    }
    .page.next {
      opacity: .12;
      transform: translateX(4%) scale(.98);
      z-index: 0;
    }
    .meta {
      margin-top: 14px;
      text-align: center;
      color: #f4e8d4;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .progress {
      height: 8px;
      width: min(520px, 84vw);
      background: rgba(239, 229, 207, .16);
      border: 1px solid rgba(239, 229, 207, .35);
      margin: 14px auto 0;
    }
    .bar {
      height: 100%;
      width: 0%;
      background: var(--red);
      transition: width .25s ease;
    }
    @media (max-width: 760px) {
      header { align-items: flex-start; flex-direction: column; }
      .controls { justify-content: flex-start; }
      .reader { min-height: auto; padding-top: 12px; }
      .book { width: min(78vh, 96vw); }
    }
  </style>
</head>

      <div class="progress"><div class="bar" id="bar"></div></div>

  <script>
    const pages = Array.from(document.querySelectorAll(".page"));
    const counter = document.querySelector("#counter");
    const bar = document.querySelector("#bar");
    let current = 0;

    function render() {
      pages.forEach((page, index) => {
        page.classList.toggle("active", index === current);
        page.classList.toggle("prev", index === current - 1);
        page.classList.toggle("next", index === current + 1);
      });
      counter.textContent = `Page ${current + 1} / ${pages.length}`;
      bar.style.width = `${((current + 1) / pages.length) * 100}%`;
    }

    document.querySelector("#prev").addEventListener("click", () => {
      current = Math.max(0, current - 1);
      render();
    });
    document.querySelector("#next").addEventListener("click", () => {
      current = Math.min(pages.length - 1, current + 1);
      render();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") document.querySelector("#prev").click();
      if (event.key === "ArrowRight") document.querySelector("#next").click();
    });
    document.querySelector("#book").addEventListener("click", () => {
      current = Math.min(pages.length - 1, current + 1);
      render();
    });
    render();
  </script>
